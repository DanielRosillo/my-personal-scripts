 <script>
      document.addEventListener("keydown", function (e) {
        if (e.key === "F12") {
          e.preventDefault();
        }

        if (e.ctrlKey && e.key === "u") {
          e.preventDefault();
        }
      });

      document.addEventListener("contextmenu", function (e) {
        e.preventDefault();
      });

      if (event.ctrlKey && event.shiftKey && event.key.toLowerCase() === "i") {
        event.preventDefault();
      }
</script>
